[package]
name = "pdecl"
version = "0.1.0"
edition = "2024"
description = "Declarative package state for Arch Linux"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
